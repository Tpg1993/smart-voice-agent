version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voice-agent-postgres
    restart: always
    environment:
      POSTGRES_USER: voiceadmin
      POSTGRES_PASSWORD: voicepassword
      POSTGRES_DB: voice_agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voice-agent-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
